<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>

<style>
    body {
        font-family: Arial, sans-serif;
        margin: 0;
        padding: 0;
        background-color: #f4f4f9;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
    }

    .add-book-form {
        background-color: #ffffff;
        padding: 20px;
        border-radius: 8px;
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        width: 100%;
        max-width: 400px;
    }

    .add-book-form label {
        display: block;
        margin-bottom: 8px;
        font-weight: bold;
        color: #333;
    }

    .add-book-form input,
    .add-book-form textarea {
        width: 100%;
        padding: 10px;
        margin-bottom: 15px;
        border: 1px solid #ccc;
        border-radius: 4px;
        font-size: 14px;
    }

    .add-book-form textarea {
        resize: none;
        height: 100px;
    }

    .add-book-form button {
        width: 100%;
        padding: 10px;
        background-color: #007bff;
        color: #ffffff;
        border: none;
        border-radius: 4px;
        font-size: 16px;
        cursor: pointer;
    }

    .add-book-form button:hover {
        background-color: #0056b3;
    }
</style>


<body>
    <form class="add-book-form">
        <label for="book-title">Title:</label>
        <input type="text" id="book-title" name="book-title" placeholder="Enter book title" required>
        
        <label for="book-description">Description:</label>
        <textarea id="book-description" name="book-description" placeholder="Enter book description"></textarea>
        
        <label for="book-image">Image URL:</label>
        <input type="text" id="book-image" name="book-image" placeholder="Enter image URL" >
        
        <button type="submit" class="submit"  onclick="addbtn(event)">Add Book</button>
    </form>

    <script src="script.js"></script>
</body>
</html>
