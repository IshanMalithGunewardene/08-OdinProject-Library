<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">

</head>

<body>

    <section class="card-grid">
        <div class="cards" onclick="img1()"><img src="/assets/images/game-of-thrones-the.jpg" alt=""></div>
        <div class="cards" onclick="img2()"><img src="./assets/images/sherlock-holems.jpg" alt=""></div>
        <div class="cards" onclick="img3()"><img src="./assets/images/harry-potter.jpg" alt=""></div>

        <div class="add-items cards" onclick="addNewItem(),addNewItemStyles()">
            <div class="add-items__round-button">
                <img src="./assets/icouns/cross.png" alt="">
            </div>
        </div>
    </section>

    <section class="book-details">
        <div class="card-botom"><img src="/assets/images/game-of-thrones-the.jpg" alt=""></div>
        <div class="text">
            <h1 id="title">Game of Thrones </h1>
            <p id="discription">Game of Thrones is a fantasy drama series based on George R.R. Martin's novels. It
                features a complex web of characters, political intrigue, and epic battles in the struggle for the Iron
                Throne.</p>
        </div>
    </section>

    <section class="add-new-item">
        <h1>Add New Book</h1>
        <form class="add-book-form">
            <label for="book-title">Title:</label>
            <input type="text" id="book-title" name="book-title" placeholder="Enter book title" required>

            <!-- <label for="book-author">Author:</label>
            <input type="text" id="book-author" name="book-author" placeholder="Enter author name" required> -->

            <label for="book-description">Description:</label>
            <textarea id="book-description" name="book-description" placeholder="Enter book description"
                required></textarea>

            <label for="book-image">Image URL:</label>
            <input type="url" id="book-image" name="book-image" placeholder="Enter image URL">

            <button type="submit" class="submit" onclick="addbtn()">Add Book</button>
        </form>
    </section>

    <script src="script.js"></script>
    <!-- <script src="autoRefresh.js"></script> -->
</body>

</html>
